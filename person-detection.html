<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detecție persoane — cameră live</title>
<meta name="description" content="Aplicație care folosește camera și încadrează persoanele detectate cu eticheta HUMAN.">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0d12;
    color: #eef1f5;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 20px 16px 32px;
  }
  h1 {
    font-size: 1.15rem;
    font-weight: 600;
    margin: 4px 0 0;
    text-align: center;
  }
  #status {
    font-size: 0.9rem;
    color: #9aa4b2;
    min-height: 1.2em;
    text-align: center;
  }
  #stage {
    position: relative;
    width: 100%;
    max-width: 720px;
    aspect-ratio: 4 / 3;
    background: #14161c;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 40px -12px rgba(0,0,0,0.6);
  }
  video, canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  video.mirrored, canvas.mirrored { transform: scaleX(-1); }
  #controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    background: #4f8cff;
    color: #fff;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:not(:disabled):hover { transform: translateY(-1px); }
  button.secondary { background: #2a2e38; color: #d7dce4; }
  #count {
    font-size: 0.85rem;
    color: #9aa4b2;
  }
  #count strong { color: #7fe08c; }
</style>
</head>
<body>

<h1>Detecție persoane în timp real</h1>
<div id="status">Apasă „Pornește camera” pentru a începe.</div>

<div id="stage">
  <video id="video" class="mirrored" autoplay playsinline muted></video>
  <canvas id="overlay" class="mirrored"></canvas>
</div>

<div id="controls">
  <button id="startBtn">Pornește camera</button>
  <button id="switchBtn" class="secondary">Schimbă camera</button>
  <button id="stopBtn" class="secondary" disabled>Oprește</button>
</div>
<div id="count">Persoane detectate: <strong id="countValue">0</strong></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.1.0/dist/blazeface.min.js"></script>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const switchBtn = document.getElementById('switchBtn');
const stopBtn = document.getElementById('stopBtn');
const countValue = document.getElementById('countValue');

let bodyModel = null;
let faceModel = null;
let modelError = null;
let stream = null;
let running = false;
let rafId = null;
let currentFacing = 'user';   // 'user' = cameră față, 'environment' = cameră spate
let mirrored = true;          // doar camera față se oglindește

function applyMirror() {
  video.classList.toggle('mirrored', mirrored);
  canvas.classList.toggle('mirrored', mirrored);
}

async function loadModels() {
  // iOS Safari's WebGL2 driver fails to link tfjs's packed shaders
  // ("Failed to link vertex and fragment shaders"); WebGL1 avoids it.
  tf.env().set('WEBGL_VERSION', 1);
  try {
    await tf.setBackend('webgl');
    await tf.ready();
    [bodyModel, faceModel] = await Promise.all([cocoSsd.load(), blazeface.load()]);
    if (running) statusEl.textContent = 'Detecție activă.';
    return;
  } catch (err) {
    // Fall back to the much slower CPU backend if WebGL is unusable at all.
    try {
      await tf.setBackend('cpu');
      await tf.ready();
      [bodyModel, faceModel] = await Promise.all([cocoSsd.load(), blazeface.load()]);
      if (running) statusEl.textContent = 'Detecție activă (mod compatibilitate, mai lent).';
      return;
    } catch (err2) {
      modelError = err2;
      statusEl.textContent = 'Cameră pornită, dar modelul AI nu s-a putut încărca: ' + err2.message;
    }
  }
}

async function openStream() {
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: currentFacing } },
    audio: false
  });
  video.srcObject = stream;
  await video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
}

async function startCamera() {
  startBtn.disabled = true;
  statusEl.textContent = 'Se solicită acces la cameră…';
  try {
    await openStream();
    running = true;
    stopBtn.disabled = false;
    statusEl.textContent = bodyModel ? 'Detecție activă.' : 'Cameră pornită, se încarcă modelul AI…';
    detectLoop();
  } catch (err) {
    statusEl.textContent = 'Acces refuzat sau cameră indisponibilă: ' + err.message;
    startBtn.disabled = false;
  }
}

function stopCamera() {
  running = false;
  if (rafId) cancelAnimationFrame(rafId);
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  startBtn.disabled = false;
  stopBtn.disabled = true;
  countValue.textContent = '0';
  statusEl.textContent = 'Oprit. Apasă „Pornește camera” pentru a relua.';
}

async function switchCamera() {
  switchBtn.disabled = true;
  currentFacing = currentFacing === 'user' ? 'environment' : 'user';
  mirrored = currentFacing === 'user';
  applyMirror();

  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  if (running) {
    if (rafId) cancelAnimationFrame(rafId);
    statusEl.textContent = 'Se comută camera…';
    try {
      await openStream();
      statusEl.textContent = bodyModel ? 'Detecție activă.' : 'Cameră pornită, se încarcă modelul AI…';
      detectLoop();
    } catch (err) {
      running = false;
      stopBtn.disabled = true;
      startBtn.disabled = false;
      statusEl.textContent = 'Acces refuzat sau cameră indisponibilă: ' + err.message;
    }
  } else {
    statusEl.textContent = currentFacing === 'user'
      ? 'Cameră față selectată. Apasă „Pornește camera”.'
      : 'Cameră spate selectată. Apasă „Pornește camera”.';
  }
  switchBtn.disabled = false;
}

// Alege încadrarea unei persoane: dacă fața ei e clar vizibilă și suficient
// de mare, încadrăm fața; altfel încadrăm tot corpul detectat.
function chooseFraming(person, faces) {
  const [px, py, pw, ph] = person.bbox;
  let best = null;
  let bestArea = 0;

  faces.forEach(f => {
    const fx = f.topLeft[0], fy = f.topLeft[1];
    const fw = f.bottomRight[0] - fx, fh = f.bottomRight[1] - fy;
    const cx = fx + fw / 2, cy = fy + fh / 2;
    if (cx < px || cx > px + pw || cy < py || cy > py + ph) return;
    const area = fw * fh;
    if (area > bestArea) {
      bestArea = area;
      best = { x: fx, y: fy, w: fw, h: fh };
    }
  });

  // Fața trebuie să fie o parte semnificativă a corpului ca s-o considerăm
  // "clar vizibilă"; altfel rămânem pe încadrarea întregului corp.
  if (best && best.w > pw * 0.14) {
    const padX = best.w * 0.35;
    const padY = best.h * 0.45;
    return {
      x: Math.max(0, best.x - padX),
      y: Math.max(0, best.y - padY),
      w: best.w + padX * 2,
      h: best.h + padY * 2.1,
      kind: 'face'
    };
  }

  return { x: px, y: py, w: pw, h: ph, kind: 'body' };
}

async function detectLoop() {
  if (!running) return;

  if (!bodyModel) {
    rafId = requestAnimationFrame(detectLoop);
    return;
  }

  const [predictions, faces] = await Promise.all([
    bodyModel.detect(video),
    faceModel ? faceModel.estimateFaces(video, false) : Promise.resolve([])
  ]);
  const people = predictions.filter(p => p.class === 'person' && p.score > 0.55);

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.lineWidth = 3;
  ctx.font = '600 18px -apple-system, Segoe UI, Roboto, Arial, sans-serif';
  ctx.textBaseline = 'bottom';

  people.forEach(p => {
    const box = chooseFraming(p, faces);

    ctx.strokeStyle = '#00ff6a';
    ctx.strokeRect(box.x, box.y, box.w, box.h);

    const label = 'HUMAN';
    const textWidth = ctx.measureText(label).width;
    const labelH = 24;

    ctx.fillStyle = '#00ff6a';
    ctx.fillRect(box.x - 1.5, box.y - labelH, textWidth + 12, labelH);

    ctx.fillStyle = '#0b0d12';
    if (mirrored) {
      // text is mirrored back so it reads correctly despite the mirrored canvas
      ctx.save();
      ctx.scale(-1, 1);
      ctx.fillText(label, -(box.x + 6 + textWidth), box.y - 5);
      ctx.restore();
    } else {
      ctx.fillText(label, box.x + 6, box.y - 5);
    }
  });

  countValue.textContent = String(people.length);
  rafId = requestAnimationFrame(detectLoop);
}

startBtn.addEventListener('click', startCamera);
switchBtn.addEventListener('click', switchCamera);
stopBtn.addEventListener('click', stopCamera);

loadModels();
</script>

</body>
</html>
